<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3e7a" />
      <stop offset="100%" stop-color="#1a2a50" />
    </linearGradient>
    <linearGradient id="tech-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="100%" stop-color="#5cb3ff" />
    </linearGradient>
    <linearGradient id="server-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a7c94" />
      <stop offset="100%" stop-color="#8a9cb4" />
    </linearGradient>
    <linearGradient id="cloud-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="800" height="500" fill="url(#bg-gradient)" rx="10" ry="10" />
  
  <!-- Abstract tech pattern -->
  <g opacity="0.1">
    <circle cx="100" cy="100" r="50" fill="#ffffff" />
    <circle cx="700" cy="400" r="70" fill="#ffffff" />
    <circle cx="200" cy="450" r="30" fill="#ffffff" />
    <circle cx="600" cy="150" r="40" fill="#ffffff" />
    
    <!-- Connection lines -->
    <line x1="100" y1="100" x2="200" y2="450" stroke="#ffffff" stroke-width="2" />
    <line x1="700" y1="400" x2="600" y2="150" stroke="#ffffff" stroke-width="2" />
    <line x1="100" y1="100" x2="600" y2="150" stroke="#ffffff" stroke-width="2" />
    <line x1="700" y1="400" x2="200" y2="450" stroke="#ffffff" stroke-width="2" />
  </g>
  
  <!-- Server rack illustration -->
  <g transform="translate(150, 150)">
    <rect x="0" y="0" width="150" height="200" fill="url(#server-gradient)" rx="5" ry="5" />
    
    <!-- Server units -->
    <rect x="10" y="20" width="130" height="30" fill="#2a3e7a" rx="2" ry="2" />
    <rect x="10" y="60" width="130" height="30" fill="#2a3e7a" rx="2" ry="2" />
    <rect x="10" y="100" width="130" height="30" fill="#2a3e7a" rx="2" ry="2" />
    <rect x="10" y="140" width="130" height="30" fill="#2a3e7a" rx="2" ry="2" />
    
    <!-- Server lights -->
    <circle cx="20" cy="35" r="3" fill="#5cb3ff" />
    <circle cx="20" cy="75" r="3" fill="#5cb3ff" />
    <circle cx="20" cy="115" r="3" fill="#5cb3ff" />
    <circle cx="20" cy="155" r="3" fill="#5cb3ff" />
    
    <!-- Data symbols -->
    <text x="40" y="40" font-family="monospace" font-size="12" fill="#ffffff">01001</text>
    <text x="40" y="80" font-family="monospace" font-size="12" fill="#ffffff">10110</text>
    <text x="40" y="120" font-family="monospace" font-size="12" fill="#ffffff">11001</text>
    <text x="40" y="160" font-family="monospace" font-size="12" fill="#ffffff">01010</text>
  </g>
  
  <!-- Cloud illustration -->
  <g transform="translate(500, 180)">
    <ellipse cx="0" cy="0" rx="80" ry="50" fill="url(#cloud-gradient)" />
    <ellipse cx="-40" cy="-20" rx="50" ry="30" fill="url(#cloud-gradient)" />
    <ellipse cx="40" cy="-10" rx="50" ry="40" fill="url(#cloud-gradient)" />
    
    <!-- Cloud icons -->
    <g transform="translate(-30, 0)" fill="#4a90e2">
      <rect x="-10" y="-10" width="20" height="20" rx="2" ry="2" />
      <text x="-5" y="5" font-family="monospace" font-size="14" fill="#ffffff">D</text>
    </g>
    
    <g transform="translate(10, 5)" fill="#4a90e2">
      <rect x="-10" y="-10" width="20" height="20" rx="2" ry="2" />
      <text x="-5" y="5" font-family="monospace" font-size="14" fill="#ffffff">A</text>
    </g>
    
    <g transform="translate(30, -15)" fill="#4a90e2">
      <rect x="-10" y="-10" width="20" height="20" rx="2" ry="2" />
      <text x="-5" y="5" font-family="monospace" font-size="14" fill="#ffffff">S</text>
    </g>
  </g>
  
  <!-- Connection between server and cloud -->
  <g>
    <path d="M300,250 C350,200 400,300 420,180" stroke="url(#tech-gradient)" stroke-width="4" fill="none" stroke-dasharray="10,5" />
    
    <!-- Data packets -->
    <circle cx="330" cy="230" r="5" fill="#5cb3ff" />
    <circle cx="370" cy="220" r="5" fill="#5cb3ff" />
    <circle cx="400" cy="200" r="5" fill="#5cb3ff" />
  </g>
  
  <!-- Code window -->
  <g transform="translate(350, 350)">
    <rect x="-100" y="-50" width="200" height="100" fill="#1a1a1a" rx="5" ry="5" />
    <rect x="-95" y="-45" width="190" height="15" fill="#333333" rx="2" ry="2" />
    
    <!-- Code lines -->
    <text x="-90" y="-15" font-family="monospace" font-size="10" fill="#5cb3ff">function connectServices() {</text>
    <text x="-90" y="0" font-family="monospace" font-size="10" fill="#ffffff">  const data = fetchFromServer();</text>
    <text x="-90" y="15" font-family="monospace" font-size="10" fill="#ffffff">  processInCloud(data);</text>
    <text x="-90" y="30" font-family="monospace" font-size="10" fill="#5cb3ff">}</text>
  </g>
  
  <!-- Title -->
  <g transform="translate(400, 80)">
    <text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Comprehensive IT Solutions</text>
    <line x1="-150" y1="15" x2="150" y2="15" stroke="url(#tech-gradient)" stroke-width="3" />
  </g>
</svg>