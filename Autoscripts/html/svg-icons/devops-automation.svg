<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#D81B60" />
    </linearGradient>
  </defs>
  
  <!-- Gear 1 -->
  <circle cx="24" cy="24" r="10" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <path d="M24,14 L24,16 M24,32 L24,34 M14,24 L16,24 M32,24 L34,24 M16.7,16.7 L18.1,18.1 M29.9,29.9 L31.3,31.3 M16.7,31.3 L18.1,29.9 M29.9,18.1 L31.3,16.7" stroke="url(#gradient1)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="24" r="4" fill="url(#gradient1)" opacity="0.8"/>
  
  <!-- Gear 2 -->
  <circle cx="40" cy="40" r="10" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <path d="M40,30 L40,32 M40,48 L40,50 M30,40 L32,40 M48,40 L50,40 M32.7,32.7 L34.1,34.1 M45.9,45.9 L47.3,47.3 M32.7,47.3 L34.1,45.9 M45.9,34.1 L47.3,32.7" stroke="url(#gradient1)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="40" cy="40" r="4" fill="url(#gradient1)" opacity="0.8"/>
  
  <!-- Connecting arrows -->
  <path d="M30,24 L34,24 L34,34 L40,34" fill="none" stroke="url(#gradient1)" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M24,30 L24,34 L34,34" fill="none" stroke="url(#gradient1)" stroke-width="1.5" stroke-dasharray="2,2"/>
  
  <!-- Infinity/Continuous loop symbol -->
  <path d="M22,48 C18,44 18,40 22,36 C26,32 30,32 34,36 C38,40 42,40 46,36 C50,32 50,28 46,24" fill="none" stroke="url(#gradient1)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Code brackets -->
  <path d="M12,18 L8,24 L12,30" fill="none" stroke="url(#gradient1)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52,30 L56,24 L52,18" fill="none" stroke="url(#gradient1)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>