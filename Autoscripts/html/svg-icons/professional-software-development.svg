<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f9fc" stop-opacity="1" />
      <stop offset="100%" stop-color="#e6ecf5" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a73dd" stop-opacity="1" />
      <stop offset="100%" stop-color="#0e4094" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a73dd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2a73dd" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="1200" height="500" rx="15" ry="15" fill="url(#bg-gradient)" />
  
  <!-- Abstract tech pattern -->
  <g opacity="0.1" stroke="#2a73dd" stroke-width="1.5">
    <!-- Grid lines -->
    <line x1="100" y1="100" x2="1100" y2="100" />
    <line x1="100" y1="200" x2="1100" y2="200" />
    <line x1="100" y1="300" x2="1100" y2="300" />
    <line x1="100" y1="400" x2="1100" y2="400" />
    
    <line x1="200" y1="50" x2="200" y2="450" />
    <line x1="400" y1="50" x2="400" y2="450" />
    <line x1="600" y1="50" x2="600" y2="450" />
    <line x1="800" y1="50" x2="800" y2="450" />
    <line x1="1000" y1="50" x2="1000" y2="450" />
    
    <!-- Connection nodes -->
    <circle cx="200" cy="100" r="5" fill="#2a73dd" />
    <circle cx="400" cy="100" r="5" fill="#2a73dd" />
    <circle cx="600" cy="100" r="5" fill="#2a73dd" />
    <circle cx="800" cy="100" r="5" fill="#2a73dd" />
    <circle cx="1000" cy="100" r="5" fill="#2a73dd" />
    
    <circle cx="200" cy="200" r="5" fill="#2a73dd" />
    <circle cx="400" cy="200" r="5" fill="#2a73dd" />
    <circle cx="600" cy="200" r="5" fill="#2a73dd" />
    <circle cx="800" cy="200" r="5" fill="#2a73dd" />
    <circle cx="1000" cy="200" r="5" fill="#2a73dd" />
    
    <circle cx="200" cy="300" r="5" fill="#2a73dd" />
    <circle cx="400" cy="300" r="5" fill="#2a73dd" />
    <circle cx="600" cy="300" r="5" fill="#2a73dd" />
    <circle cx="800" cy="300" r="5" fill="#2a73dd" />
    <circle cx="1000" cy="300" r="5" fill="#2a73dd" />
    
    <circle cx="200" cy="400" r="5" fill="#2a73dd" />
    <circle cx="400" cy="400" r="5" fill="#2a73dd" />
    <circle cx="600" cy="400" r="5" fill="#2a73dd" />
    <circle cx="800" cy="400" r="5" fill="#2a73dd" />
    <circle cx="1000" cy="400" r="5" fill="#2a73dd" />
  </g>
  
  <!-- Left side: Software Development Illustration -->
  <g transform="translate(300, 250)">
    <!-- Code window -->
    <rect x="-150" y="-120" width="300" height="240" rx="10" ry="10" fill="#ffffff" stroke="#d1d8e0" stroke-width="2" />
    <rect x="-150" y="-120" width="300" height="30" rx="10" ry="10" fill="#e6ecf5" stroke="#d1d8e0" stroke-width="2" />
    <circle cx="-130" cy="-105" r="5" fill="#ff6b6b" />
    <circle cx="-110" cy="-105" r="5" fill="#feca57" />
    <circle cx="-90" cy="-105" r="5" fill="#1dd1a1" />
    
    <!-- Code lines -->
    <rect x="-130" y="-70" width="120" height="10" rx="2" ry="2" fill="#e6ecf5" />
    <rect x="-130" y="-50" width="200" height="10" rx="2" ry="2" fill="#e6ecf5" />
    <rect x="-130" y="-30" width="180" height="10" rx="2" ry="2" fill="#e6ecf5" />
    <rect x="-130" y="-10" width="150" height="10" rx="2" ry="2" fill="#e6ecf5" />
    <rect x="-130" y="10" width="220" height="10" rx="2" ry="2" fill="#e6ecf5" />
    <rect x="-130" y="30" width="160" height="10" rx="2" ry="2" fill="#e6ecf5" />
    <rect x="-130" y="50" width="190" height="10" rx="2" ry="2" fill="#e6ecf5" />
    <rect x="-130" y="70" width="140" height="10" rx="2" ry="2" fill="#e6ecf5" />
    <rect x="-130" y="90" width="210" height="10" rx="2" ry="2" fill="#e6ecf5" />
    
    <!-- Accent elements -->
    <rect x="-110" y="-70" width="30" height="10" rx="2" ry="2" fill="url(#accent-gradient)" />
    <rect x="-90" y="-50" width="40" height="10" rx="2" ry="2" fill="url(#accent-gradient)" />
    <rect x="-70" y="-10" width="25" height="10" rx="2" ry="2" fill="url(#accent-gradient)" />
    <rect x="-100" y="30" width="35" height="10" rx="2" ry="2" fill="url(#accent-gradient)" />
    <rect x="-80" y="70" width="30" height="10" rx="2" ry="2" fill="url(#accent-gradient)" />
  </g>
  
  <!-- Right side: IT Solutions Illustration -->
  <g transform="translate(900, 250)">
    <!-- Cloud and server infrastructure -->
    <path d="M-100,0 C-130,0 -130,-40 -100,-40 C-100,-60 -80,-70 -60,-55 C-45,-80 -5,-80 10,-55 C25,-70 45,-60 45,-40 C75,-40 75,0 45,0 Z" 
          fill="#ffffff" stroke="#d1d8e0" stroke-width="2" />
    
    <!-- Server rack -->
    <rect x="-30" y="-80" width="60" height="120" rx="5" ry="5" fill="#ffffff" stroke="#d1d8e0" stroke-width="2" />
    <line x1="-30" y1="-60" x2="30" y2="-60" stroke="#d1d8e0" stroke-width="2" />
    <line x1="-30" y1="-40" x2="30" y2="-40" stroke="#d1d8e0" stroke-width="2" />
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#d1d8e0" stroke-width="2" />
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#d1d8e0" stroke-width="2" />
    <line x1="-30" y1="20" x2="30" y2="20" stroke="#d1d8e0" stroke-width="2" />
    
    <!-- Server lights -->
    <circle cx="-20" cy="-70" r="3" fill="#1dd1a1" />
    <circle cx="-20" cy="-50" r="3" fill="#1dd1a1" />
    <circle cx="-20" cy="-30" r="3" fill="#1dd1a1" />
    <circle cx="-20" cy="-10" r="3" fill="#feca57" />
    <circle cx="-20" cy="10" r="3" fill="#1dd1a1" />
    <circle cx="-20" cy="30" r="3" fill="#1dd1a1" />
    
    <!-- Connection lines -->
    <path d="M-60,-20 C-50,-20 -50,-20 -40,-20" stroke="url(#accent-gradient)" stroke-width="2" fill="none" />
    <path d="M-60,0 C-50,0 -50,0 -40,0" stroke="url(#accent-gradient)" stroke-width="2" fill="none" />
    <path d="M-60,20 C-50,20 -50,20 -40,20" stroke="url(#accent-gradient)" stroke-width="2" fill="none" />
  </g>
  
  <!-- Center connecting element -->
  <g transform="translate(600, 250)">
    <circle cx="0" cy="0" r="80" fill="url(#glow-gradient)" opacity="0.5" />
    <circle cx="0" cy="0" r="60" fill="#ffffff" stroke="url(#accent-gradient)" stroke-width="3" />
    
    <!-- Connection lines to left and right illustrations -->
    <path d="M-60,0 C-120,0 -180,0 -240,0" stroke="url(#accent-gradient)" stroke-width="2" stroke-dasharray="5,5" fill="none" />
    <path d="M60,0 C120,0 180,0 240,0" stroke="url(#accent-gradient)" stroke-width="2" stroke-dasharray="5,5" fill="none" />
    
    <!-- Central icon - gear and code -->
    <g transform="translate(0, 0) scale(0.8)">
      <!-- Gear -->
      <circle cx="0" cy="0" r="30" fill="url(#accent-gradient)" />
      <path d="M0,-45 L0,-35 M32,-32 L25,-25 M45,0 L35,0 M32,32 L25,25 M0,45 L0,35 M-32,32 L-25,25 M-45,0 L-35,0 M-32,-32 L-25,-25" 
            stroke="url(#accent-gradient)" stroke-width="6" stroke-linecap="round" />
      
      <!-- Code symbol -->
      <text x="0" y="7" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">&lt;/&gt;</text>
    </g>
  </g>
  
  <!-- Title overlay at bottom -->
  <rect x="300" y="420" width="600" height="60" rx="10" ry="10" fill="#ffffff" opacity="0.9" />
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333333">
    Professional Software Development &amp; IT Solutions
  </text>
</svg>